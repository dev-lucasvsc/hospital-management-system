# =============================================
# Configuração do banco de dados PostgreSQL
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:210805}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# Redis — fila de notificações do worker
# =============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# =============================================
# JWT — autenticação stateless
# =============================================
# Em produção, definir JWT_SECRET com valor longo e aleatório (mínimo 32 chars)
jwt.secret=${JWT_SECRET:hospital-sistema-secret-key-unieuro-2025}
jwt.expiration=28800000

# =============================================
# WhatsApp Business API
# =============================================
whatsapp.token=${WHATSAPP_TOKEN:}