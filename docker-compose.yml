version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hospital-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 210805
      POSTGRES_DB: hospital_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Sistema/demo
      dockerfile: Dockerfile
    container_name: hospital-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/hospital_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=210805
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - REDIS_HOST=redis

  frontend:
    build:
      context: "./Front Sistema/recepcao-hospital"
      dockerfile: Dockerfile
    container_name: hospital-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # Container cliente — simulação de usuário real com IP próprio
  # Usar via rodar-testes.ps1 ou:
  # docker-compose --profile test up --scale cliente=20
  cliente:
    build:
      context: .
      dockerfile: Dockerfile.cliente
    profiles:
      - test
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - MODO=continuo
      - CICLOS=10
      - INTERVALO=1
    volumes:
      - ./logs:/logs
    restart: "no"

  # Container benchmark — mede velocidade por tipo de requisição
  # docker-compose --profile benchmark run --rm benchmark
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.cliente
    profiles:
      - benchmark
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - MODO=benchmark
    volumes:
      - ./logs:/logs
    restart: "no"

volumes:
  postgres_data: